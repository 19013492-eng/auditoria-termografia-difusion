[project]
name = "Evaluacion_termografia_difusion"
version = "0.1.0"
description = "Repositorio de ensayos y auditoria visual de modelos de difusion en termografia industrial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.42.1",
    "gradio>=6.31.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "scikit-image>=0.26.0",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
]
[tool.uv]
package = false
